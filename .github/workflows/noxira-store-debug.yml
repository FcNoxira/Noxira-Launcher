name: Build NOXIRA STORE Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'noxira-store/**'
      - '.github/workflows/noxira-store-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: noxira-store
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noxira-store-debug-apk
          path: noxira-store/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
